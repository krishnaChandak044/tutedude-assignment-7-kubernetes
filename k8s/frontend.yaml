apiVersion: apps/v1
kind: Deployment
metadata: {name: express-frontend, labels: {app: express-frontend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: express-frontend}}
  template:
    metadata: {labels: {app: express-frontend}}
    spec:
      containers:
        - name: express
          image: tutedude-node-frontend:local
          imagePullPolicy: IfNotPresent
          env:
            - {name: PORT, value: "3000"}
            - {name: API_URL, value: "http://backend:5000"}
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, labels: {app: express-frontend}}
spec:
  type: NodePort
  selector: {app: express-frontend}
  ports: [{name: http, port: 3000, targetPort: 3000, nodePort: 30080}]
