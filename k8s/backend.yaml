apiVersion: apps/v1
kind: Deployment
metadata: {name: flask-backend, labels: {app: flask-backend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: flask-backend}}
  template:
    metadata: {labels: {app: flask-backend}}
    spec:
      containers:
        - name: flask
          image: tutedude-flask-backend:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          readinessProbe: {httpGet: {path: /api/ready, port: 5000}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/ready, port: 5000}, initialDelaySeconds: 8, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: flask-backend}
  ports: [{name: http, port: 5000, targetPort: 5000}]
